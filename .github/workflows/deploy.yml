name: Validation & Quality Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # 1. Ensure the code is clean and builds correctly
  validate:
    name: 🏗️ Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📚 Validate Project Documentation
        run: npm run docs:check

      - name: 🧪 Run Lint & Format
        run: |
          npm run lint
          npm run format:check
          npm run type-check
          npm test

      - name: 🛠️ Build Check
        run: npm run build

  # 2. Final check for merge conflicts (PRs only)
  check-conflicts:
    name: 🛡️ Conflict Check
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Verify Mergeability
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge --no-commit --no-ff origin/${{ github.base_ref }} 2>&1 | grep -q "CONFLICT"; then
            echo "❌ CONFLICT: Branch is out of sync."
            exit 1
          else
            echo "✅ No conflicts."
          fi

  # 3. Final PR readiness status
  pr-ready:
    name: 🏁 PR Readiness Signal
    runs-on: ubuntu-latest
    needs: [check-conflicts]
    if: github.event_name == 'pull_request'
    steps:
      - name: ✅ Approval
        run: echo "Repository validation and conflict checks passed."
